<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Test</title>
    <link rel="stylesheet" href="week6.css">
    <script src="week6.js" defer></script>
</head>
<body>
    <div class="gallery-container">
        <header class="gallery-header">Photo Gallery</header>

        <nav class="gallery-nav">
            <button>All</button>
            <button>Nature</button>
            <button>Architecture</button>
        </nav>

        <aside class="gallery-sidebar">Filter Options</aside>

        <main class="gallery-grid">
            <div class="photo-card featured" id="four" data-category="nature">Photo #4 (Featured, Nature)</div>
            <div class="photo-card" id="one" data-category="nature">Photo #1 (Nature)</div>
            <div class="photo-card" id="two" data-category="architecture">Photo #2 (Architecture)</div>
            <div class="photo-card" id="three" data-category="architecture">Photo #3 (Architecture)</div>
            <div class="photo-card" id="five" data-category="nature">Photo #5 (Nature)</div>
            <div class="photo-card" id="six" data-category="architecture">Photo #6 (Architecture)</div>
        </main>
    </div>
</body>
</html>
